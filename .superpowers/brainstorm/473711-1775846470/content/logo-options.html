<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #ccc; font-family: 'JetBrains Mono', monospace; padding: 60px 40px; }
  h2 { font-size: 20px; color: #fff; margin-bottom: 8px; text-align: center; font-family: 'JetBrains Mono', monospace; }
  .sub { text-align: center; color: #555; font-size: 12px; margin-bottom: 48px; }

  .options { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }

  .option {
    display: flex; align-items: center; gap: 20px;
    padding: 24px 28px; border-radius: 8px;
    border: 2px solid #161616; cursor: pointer;
    transition: all 0.2s; background: #050505;
  }
  .option:hover { border-color: #2a2a2a; }
  .option.selected { border-color: #e87a2a; }

  .letter {
    font-size: 14px; color: #444; min-width: 24px;
  }

  .logo-preview {
    font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
  }

  .logo-desc {
    font-size: 11px; color: #555; margin-left: auto;
  }

  .c-white { color: #eee; }
  .c-dim { color: #3a3a3a; }
  .c-orange { color: #e87a2a; }
  .c-muted { color: #666; }
</style>
</head>
<body>

<h2>Logo Iterations</h2>
<p class="sub">Black + Orange theme. Click to select.</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <span class="letter">A</span>
    <span class="logo-preview">
      <span class="c-orange">./</span><span class="c-white">revoca</span><span class="c-dim">.ai</span>
    </span>
    <span class="logo-desc">terminal path style</span>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <span class="letter">B</span>
    <span class="logo-preview">
      <span class="c-muted">./</span><span class="c-white">revoca</span><span class="c-orange">.ai</span>
    </span>
    <span class="logo-desc">accent on .ai</span>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <span class="letter">C</span>
    <span class="logo-preview">
      <span class="c-orange">$</span> <span class="c-white">revoca</span><span class="c-dim">.ai</span>
    </span>
    <span class="logo-desc">shell prompt style</span>
  </div>

  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <span class="letter">D</span>
    <span class="logo-preview">
      <span class="c-dim">[</span><span class="c-white">revoca</span><span class="c-orange">.ai</span><span class="c-dim">]</span>
    </span>
    <span class="logo-desc">bracketed, code-block feel</span>
  </div>

  <div class="option" data-choice="e" onclick="toggleSelect(this)">
    <span class="letter">E</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-dim">.ai</span>
    </span>
    <span class="logo-desc">CLI cursor style</span>
  </div>
</div>

</body>
</html>
