<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #ccc; font-family: 'JetBrains Mono', monospace; padding: 60px 40px; }
  h2 { font-size: 20px; color: #fff; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; color: #555; font-size: 12px; margin-bottom: 48px; }

  .options { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }

  .option {
    display: flex; align-items: center; gap: 20px;
    padding: 28px 28px; border-radius: 8px;
    border: 2px solid #161616; cursor: pointer;
    transition: all 0.2s; background: #050505;
  }
  .option:hover { border-color: #2a2a2a; }
  .option.selected { border-color: #e87a2a; }

  .letter { font-size: 14px; color: #444; min-width: 24px; }
  .logo-preview { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-desc { font-size: 11px; color: #555; margin-left: auto; max-width: 160px; text-align: right; line-height: 1.4; }

  .c-white { color: #eee; }
  .c-dim { color: #3a3a3a; }
  .c-orange { color: #e87a2a; }
  .c-orange-soft { color: #c06a25; }
  .c-muted { color: #666; }
</style>
</head>
<body>

<h2>Logo E — .ai emphasis variants</h2>
<p class="sub">Orange cursor + visible .ai</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <span class="letter">E1</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-orange">.ai</span>
    </span>
    <span class="logo-desc">orange .ai, matches cursor</span>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <span class="letter">E2</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-muted">.</span><span class="c-orange">ai</span>
    </span>
    <span class="logo-desc">dim dot, orange "ai" only</span>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <span class="letter">E3</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-white">.</span><span class="c-orange">ai</span>
    </span>
    <span class="logo-desc">white dot, orange "ai"</span>
  </div>

  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <span class="letter">E4</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-orange-soft">.</span><span class="c-white" style="font-weight:800;">ai</span>
    </span>
    <span class="logo-desc">soft orange dot, bold white "ai"</span>
  </div>

  <div class="option" data-choice="e" onclick="toggleSelect(this)">
    <span class="letter">E5</span>
    <span class="logo-preview">
      <span class="c-orange">&gt;</span> <span class="c-white">revoca</span><span class="c-orange">.</span><span class="c-white" style="text-transform:uppercase; font-size:16px; letter-spacing:2px; font-weight:800;">AI</span>
    </span>
    <span class="logo-desc">orange dot, uppercase AI</span>
  </div>
</div>

</body>
</html>
